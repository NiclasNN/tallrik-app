  <script>(function(){try{var t=localStorage.getItem('tallrik.theme');if(t){var d=document.documentElement;d.setAttribute('data-theme',t);if(/^malin/.test(t)){d.setAttribute('data-cute','1');var l=document.querySelector('link[rel=apple-touch-icon]');if(l)l.href='icons/apple-touch-icon-malin.png';document.addEventListener('DOMContentLoaded',function(){var i=document.querySelector('#boot img');if(i)i.src='icons/icon-192-malin.png';});}var c={dark:'#0A0C12',light:'#F3F4F8',malin:'#FFF4F8','malin-dark':'#1B1020'}[t];if(c)document.querySelector('meta[name=theme-color]').setAttribute('content',c);}}catch(e){}})();</script>

  <style>
    /* Första målningen innan JS: samma bakgrund som appen, inget vitt blink */
    #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg, #0A0C12); z-index: 100; transition: opacity .35s ease; }
    #boot.out { opacity: 0; pointer-events: none; }
    #boot img { width: 84px; height: 84px; border-radius: 22px; animation: bootPulse 1.4s ease-in-out infinite; }
    @keyframes bootPulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }
  </style>

  <div id="boot" aria-hidden="true"><img src="icons/icon-192.png" alt=""></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
